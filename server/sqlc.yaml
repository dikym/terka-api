version: "2"
sql:
  - engine: postgresql
    queries: queries
    # Only what the auth queries touch; the learning tables are reached through JSON, not sqlc.
    schema:
      - migrations/00000000000000_platform.sql
      - migrations/20261113000001_auth.sql
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
