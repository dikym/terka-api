# Live reload for `make dev`: rebuild and restart the server whenever Go code or a migration changes.
# Migrations are embedded in the binary, but `make dev` applies them only at start; rerun it after
# adding one.
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/terka ./cmd/terka"
entrypoint = ["./tmp/terka", "serve"]
include_ext = ["go", "sql"]
exclude_dir = ["tmp", "bin", "tests"]
exclude_regex = ["_test\\.go$"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "2s"

[log]
time = false

[misc]
clean_on_exit = true
