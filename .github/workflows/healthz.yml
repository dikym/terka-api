# Watches staging from outside the VPS and posts to Discord only when the state changes. A
# scheduled workflow runs on the default branch only.
name: healthz

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# Each run compares against the last finished one, so two at once could both post the same change.
# A run that has started is left to post; a newer run waits for it and then sees its result.
concurrency:
  group: healthz
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check /healthz
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only success and failure count: a cancelled or skipped run says nothing about staging.
          previous=$(gh run list --workflow healthz.yml --status completed --limit 10 --json conclusion \
            -q '[.[] | select(.conclusion == "success" or .conclusion == "failure")][0].conclusion // ""')
          code=0
          state=$(bash deploy/scripts/healthz-check.sh https://staging.terka.my.id/healthz "$previous") || code=$?
          echo "state=$state" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Tell Discord
        if: always() && (steps.check.outputs.state == 'down' || steps.check.outputs.state == 'up')
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_STAGING }}
          STATE: ${{ steps.check.outputs.state }}
        # Same shape as the Alertmanager messages: a plain heading, what happened, when, and where to look.
        run: |
          link="https://grafana.terka.my.id/d/terka/terka?var-env=staging"
          if [ "$STATE" = down ]; then
            title="Critical · Staging · Health check failing"
            text="https://staging.terka.my.id/healthz did not answer from outside the VPS."$'\n'"Since $(TZ=Asia/Jakarta date +%H:%M) WIB · $link"
            color=10038562
          else
            title="Resolved · Staging · Health check failing"
            text="https://staging.terka.my.id/healthz answers again."
            color=3066993
          fi
          jq -n --arg title "$title" --arg text "$text" --argjson color "$color" \
            '{embeds: [{title: $title, description: $text, color: $color}]}' |
            curl -fsS -H 'content-type: application/json' -d @- "$WEBHOOK"
