# A missing SPF, DKIM or DMARC record silently sends login emails to spam, so check weekly.
name: dns-check

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the email DNS records
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_PRODUCTION }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          code=0
          problems=$(bash deploy/scripts/dns-check.sh) || code=$?
          if [ "$code" -ne 0 ]; then
            printf '%s\n' "$problems"
            # Same shape as the Alertmanager messages: a plain heading, what is wrong, and where to look.
            jq -n --arg text "$problems"$'\n'"Checked $(TZ=Asia/Jakarta date +%H:%M) WIB · $RUN_URL" \
              '{embeds: [{title: "Critical · Production · Email DNS records broken", description: $text, color: 10038562}]}' |
              curl -fsS -H 'content-type: application/json' -d @- "$WEBHOOK"
          fi
          exit "$code"
