groups:
  - name: terka-app
    rules:
      # target_info is written on every OTLP push, so it is present for as long as the API is alive.
      # Production needs its own selector here when it joins at stage 9.
      - alert: ApiDown
        expr: absent_over_time(target_info{job="terka-api",env="staging"}[5m])
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.env }} API has reported nothing for 5 minutes. https://grafana.terka.my.id'

      # Two rules with one name, a count and a ratio, so each shows its own value.
      - alert: ApiErrors
        expr: |
          sum by (env) (increase(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[10m])) > 5
        labels:
          severity: critical
          kind: count
        annotations:
          summary: '{{ $labels.env }} API: {{ $value | printf "%.0f" }} server errors in 10 minutes. https://grafana.terka.my.id'

      # The container health check calls /readyz every 5 seconds, which would swamp the user traffic.
      - alert: ApiErrors
        expr: |
          sum by (env) (increase(http_server_request_duration_seconds_count{http_route!~"/readyz|/healthz",http_response_status_code=~"5.."}[10m]))
            / sum by (env) (increase(http_server_request_duration_seconds_count{http_route!~"/readyz|/healthz"}[10m])) > 0.05
          and
          sum by (env) (increase(http_server_request_duration_seconds_count{http_route!~"/readyz|/healthz",http_response_status_code=~"5.."}[10m])) >= 2
        labels:
          severity: critical
          kind: ratio
        annotations:
          summary: '{{ $labels.env }} API: {{ $value | humanizePercentage }} of requests failed with a server error in 10 minutes. https://grafana.terka.my.id'

      - alert: ApiSlow
        expr: |
          histogram_quantile(0.95, sum by (le, env) (rate(http_server_request_duration_seconds_bucket{http_route!~"/readyz|/healthz"}[10m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.env }} API: 95th percentile response time is {{ $value | printf "%.2f" }} s. https://grafana.terka.my.id'

  # The API creates a counter series on its first event, so the series appears at 1 and increase()
  # sees no growth. "unless ... offset" catches a series that was not there 15 minutes ago.
  - name: terka-auth
    rules:
      - alert: EmailSendFailed
        expr: |
          sum by (env) (
            (terka_auth_email_sent_total{outcome="failed"} unless terka_auth_email_sent_total{outcome="failed"} offset 15m)
            or
            (increase(terka_auth_email_sent_total{outcome="failed"}[15m]) > 0)
          )
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.env }}: {{ $value | printf "%.0f" }} sign-in email(s) failed to send in 15 minutes. https://grafana.terka.my.id'

      - alert: MailboxLocked
        expr: |
          sum by (env) (
            (terka_auth_mailbox_locked_total unless terka_auth_mailbox_locked_total offset 15m)
            or
            (increase(terka_auth_mailbox_locked_total[15m]) > 0)
          )
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.env }}: {{ $value | printf "%.0f" }} mailbox lock(s) after repeated sign-in codes in 15 minutes. https://grafana.terka.my.id'

      - alert: EmailServiceLimit
        expr: |
          sum by (env) (
            (terka_auth_email_refused_total{reason="service_limit"} unless terka_auth_email_refused_total{reason="service_limit"} offset 15m)
            or
            (increase(terka_auth_email_refused_total{reason="service_limit"}[15m]) > 0)
          )
        labels:
          severity: warning
          kind: refused
        annotations:
          summary: '{{ $labels.env }}: the email service refused {{ $value | printf "%.0f" }} send(s) for its daily limit in 15 minutes. https://grafana.terka.my.id'

      - alert: EmailServiceLimit
        expr: sum by (env) (increase(terka_auth_email_sent_total[24h])) >= 72
        labels:
          severity: warning
          kind: volume
        annotations:
          summary: '{{ $labels.env }}: {{ $value | printf "%.0f" }} sign-in emails sent in 24 hours, near the email service daily limit. https://grafana.terka.my.id'

  - name: terka-host
    rules:
      - alert: DiskFull
        expr: |
          node_filesystem_avail_bytes{mountpoint="/var/lib/alloy/data"}
            / node_filesystem_size_bytes{mountpoint="/var/lib/alloy/data"} < 0.20
        for: 5m
        labels:
          severity: critical
          env: host
        annotations:
          summary: 'VPS disk: {{ $value | humanizePercentage }} free. https://grafana.terka.my.id'

      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes < 200e6
        for: 10m
        labels:
          severity: warning
          env: host
        annotations:
          summary: 'VPS memory: {{ $value | humanize1024 }}B available. https://grafana.terka.my.id'

      - alert: OomKill
        expr: increase(node_vmstat_oom_kill[10m]) > 0
        labels:
          severity: critical
          env: host
        annotations:
          summary: 'VPS: the kernel killed {{ $value | printf "%.0f" }} process(es) for lack of memory in 10 minutes. https://grafana.terka.my.id'

  - name: terka-database
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          env: host
        annotations:
          summary: 'VPS: Postgres is not answering the metrics exporter (pg_up is {{ $value }}). https://grafana.terka.my.id'

      # env comes from the database name: terka_staging gives staging.
      - alert: DatabaseLarge
        expr: |
          label_replace(pg_database_size_bytes{datname=~"terka_.+"}, "env", "$1", "datname", "terka_(.+)") > 157286400
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.env }} database is {{ $value | humanize1024 }}B, over the 150 MiB limit. https://grafana.terka.my.id'

  - name: terka-stack
    rules:
      - alert: CollectorDown
        expr: absent_over_time(alloy_build_info[5m])
        labels:
          severity: critical
          env: host
        annotations:
          summary: 'VPS: the collector has reported nothing for 5 minutes. https://grafana.terka.my.id'

      - alert: StackWriteFailing
        expr: |
          rate(prometheus_remote_storage_samples_failed_total[10m]) > 0
          or
          rate(loki_write_dropped_entries_total[10m]) > 0
        for: 10m
        labels:
          severity: critical
          env: host
        annotations:
          summary: 'VPS: the collector is failing to write metrics or logs ({{ $value | printf "%.3f" }} per second). https://grafana.terka.my.id'
