groups:
  - name: terka-app
    rules:
      # target_info is written on every OTLP push, so it is present for as long as the API is alive.
      # Production needs its own selector here when it joins at stage 9.
      - alert: ApiDown
        expr: absent_over_time(target_info{job="terka-api",env="staging"}[5m])
        labels:
          severity: critical
        annotations:
          title: API is not reporting
          summary: 'No metrics from the API for 5 minutes.'

      # Two rules with one name, a count and a ratio, so each shows its own value.
      - alert: ApiErrors
        expr: |
          sum by (env) (increase(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[10m])) > 5
        labels:
          severity: critical
          kind: count
        annotations:
          title: API server errors
          summary: '{{ $value | printf "%.0f" }} server errors in 10 minutes.'

      # The container health check calls /readyz every 5 seconds, which would swamp the user traffic.
      - alert: ApiErrors
        expr: |
          sum by (env) (increase(http_server_request_duration_seconds_count{http_route!~"/readyz|/healthz",http_response_status_code=~"5.."}[10m]))
            / sum by (env) (increase(http_server_request_duration_seconds_count{http_route!~"/readyz|/healthz"}[10m])) > 0.05
          and
          sum by (env) (increase(http_server_request_duration_seconds_count{http_route!~"/readyz|/healthz",http_response_status_code=~"5.."}[10m])) >= 2
        labels:
          severity: critical
          kind: ratio
        annotations:
          title: API server errors
          summary: '{{ $value | humanizePercentage }} of requests failed in 10 minutes.'

      - alert: ApiSlow
        expr: |
          histogram_quantile(0.95, sum by (le, env) (rate(http_server_request_duration_seconds_bucket{http_route!~"/readyz|/healthz"}[10m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          title: API is slow
          summary: '95th percentile response time is {{ $value | printf "%.2f" }} s.'

  # The API creates a counter series on its first event, so the series appears at 1 and increase()
  # sees no growth. "unless ... offset" catches a series that was not there 15 minutes ago.
  - name: terka-auth
    rules:
      - alert: EmailSendFailed
        expr: |
          sum by (env) (
            (terka_auth_email_sent_total{outcome="failed"} unless terka_auth_email_sent_total{outcome="failed"} offset 15m)
            or
            (increase(terka_auth_email_sent_total{outcome="failed"}[15m]) > 0)
          )
        labels:
          severity: critical
        annotations:
          title: Sign-in emails failing
          summary: '{{ $value | printf "%.0f" }} sign-in email(s) failed to send in 15 minutes.'

      - alert: MailboxLocked
        expr: |
          sum by (env) (
            (terka_auth_mailbox_locked_total unless terka_auth_mailbox_locked_total offset 15m)
            or
            (increase(terka_auth_mailbox_locked_total[15m]) > 0)
          )
        labels:
          severity: warning
        annotations:
          title: Mailbox locked
          summary: '{{ $value | printf "%.0f" }} mailbox(es) locked after repeated wrong codes in 15 minutes.'

      - alert: EmailServiceLimit
        expr: |
          sum by (env) (
            (terka_auth_email_refused_total{reason="service_limit"} unless terka_auth_email_refused_total{reason="service_limit"} offset 15m)
            or
            (increase(terka_auth_email_refused_total{reason="service_limit"}[15m]) > 0)
          )
        labels:
          severity: warning
          kind: refused
        annotations:
          title: Email limit reached
          summary: 'The email service refused {{ $value | printf "%.0f" }} send(s) for its daily limit in 15 minutes.'

      # Staging and production send through one Resend account, so its daily limit counts them together.
      - alert: EmailServiceLimit
        expr: sum(increase(terka_auth_email_sent_total{outcome="ok"}[24h])) >= 72
        labels:
          severity: warning
          env: host
          kind: volume
        annotations:
          title: Email quota nearly used
          summary: '{{ $value | printf "%.0f" }} sign-in emails sent in 24 hours across all environments.'

  - name: terka-host
    rules:
      - alert: DiskFull
        expr: |
          node_filesystem_avail_bytes{mountpoint="/var/lib/alloy/data"}
            / node_filesystem_size_bytes{mountpoint="/var/lib/alloy/data"} < 0.20
        for: 5m
        labels:
          severity: critical
          env: host
        annotations:
          title: Disk almost full
          summary: '{{ $value | humanizePercentage }} disk space free.'

      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes < 200e6
        for: 10m
        labels:
          severity: warning
          env: host
        annotations:
          title: Memory low
          summary: '{{ $value | humanize1024 }}B memory available.'

      - alert: OomKill
        expr: increase(node_vmstat_oom_kill[10m]) > 0
        labels:
          severity: critical
          env: host
        annotations:
          title: Process killed for memory
          summary: 'The kernel killed {{ $value | printf "%.0f" }} process(es) for lack of memory in 10 minutes.'

  - name: terka-database
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          env: host
        annotations:
          title: Postgres is down
          summary: 'Postgres is not answering the metrics exporter.'

      # env comes from the database name: terka_staging gives staging.
      - alert: DatabaseLarge
        expr: |
          label_replace(pg_database_size_bytes{datname=~"terka_.+"}, "env", "$1", "datname", "terka_(.+)") > 157286400
        labels:
          severity: warning
        annotations:
          title: Database over 150 MiB
          summary: 'Database size is {{ $value | humanize1024 }}B.'

  - name: terka-stack
    rules:
      - alert: CollectorDown
        expr: absent_over_time(alloy_build_info[5m])
        labels:
          severity: critical
          env: host
        annotations:
          title: Collector is not reporting
          summary: 'No data from Alloy for 5 minutes.'

      - alert: StackWriteFailing
        expr: |
          rate(prometheus_remote_storage_samples_failed_total[10m]) > 0
          or
          rate(loki_write_dropped_entries_total[10m]) > 0
        for: 10m
        labels:
          severity: critical
          env: host
        annotations:
          title: Collector cannot write
          summary: 'Alloy is failing to write metrics or logs ({{ $value | printf "%.3f" }} per second).'
