# The admin password and the Cloudflare Access JWT key set and audience come from grafana.env
# (GF_SECURITY_ADMIN_PASSWORD, GF_AUTH_JWT_JWK_SET_URL, GF_AUTH_JWT_EXPECT_CLAIMS).

[server]
root_url = https://grafana.terka.my.id

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

# The VPS firewall admits every Cloudflare IP, not only this zone's, so Grafana checks the Access JWT itself.
[auth.jwt]
enabled = true
header_name = Cf-Access-Jwt-Assertion
email_claim = email
username_claim = email
auto_sign_up = true
role_attribute_path = "'Admin'"

# Otherwise Grafana downloads and updates about twenty plugins at every start, which costs memory
# and makes the stack depend on grafana.com. The bundled data sources stay available.
[plugins]
preinstall_disabled = true

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false
