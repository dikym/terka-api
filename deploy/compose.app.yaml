# One environment of the app. Lives at /opt/terka/compose.app.yaml and is run per environment:
#   TERKA_ENV_NAME=staging TERKA_IMAGE=ghcr.io/dikym/terka-go:<sha> \
#     docker compose -p terka-staging -f compose.app.yaml up -d app
name: terka-${TERKA_ENV_NAME:?set TERKA_ENV_NAME}

services:
  app:
    image: ${TERKA_IMAGE:?set TERKA_IMAGE}
    restart: unless-stopped
    env_file: ${TERKA_ENV_NAME}/.env
    read_only: true
    mem_limit: 128m
    networks:
      terka:
        # Caddy reaches each environment by this name.
        aliases: ["terka-${TERKA_ENV_NAME}"]

  migrate:
    image: ${TERKA_IMAGE}
    command: ["migrate"]
    env_file: ${TERKA_ENV_NAME}/.env
    read_only: true
    profiles: [tools]
    networks: [terka]

networks:
  terka:
    external: true
    name: terka
