---
# The owner's login: key only, passwordless sudo.
# The default reads the key of the machine running Ansible. On the VPS that is the wrong key and
# locks the owner out, so pass the laptop's public key with -e admin_ssh_public_key=...
admin_user: terka-admin
admin_ssh_public_key: "{{ lookup('ansible.builtin.file', '~/.ssh/id_ed25519.pub') }}"

# Public halves of the CI deploy keys, one per repository. An empty value installs no key.
deploy_ci_public_keys:
  api: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIpgjLHLM7xiUpg6QeNqbOMe7vm+FSOOSnrCJvEHz9Zz terka-ci-api"
  web: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDXJetqRi6WmyfK0LkQ6QL4YzFmxKGku9PfZ7+Hu3kFj terka-ci-web"

terka_root: /opt/terka
terka_environments:
  - staging

swap_size_mb: 2048

ghcr_user: "{{ vault_ghcr_user }}"
ghcr_token: "{{ vault_ghcr_token }}"

# Hex passwords only: they go into connection URLs and .env files unquoted.
postgres_superuser_password: "{{ vault_postgres_superuser_password }}"
terka_db_passwords:
  staging:
    owner: "{{ vault_staging_owner_password }}"
    app: "{{ vault_staging_app_password }}"
    auth: "{{ vault_staging_auth_password }}"

# Sign-in settings per environment. The auth key differs per environment, so a stolen staging key
# opens nothing in production.
terka_auth:
  staging:
    public_url: https://staging.terka.my.id
    auth_key: "{{ vault_staging_auth_key }}"
    google_client_id: "{{ vault_google_client_id }}"
    google_client_secret: "{{ vault_google_client_secret }}"
    turnstile_secret: "{{ vault_staging_turnstile_secret }}"
    turnstile_hostnames: staging.terka.my.id
    smtp_url: "{{ vault_smtp_url }}"
    mail_from: Terka <no-reply@terka.my.id>
