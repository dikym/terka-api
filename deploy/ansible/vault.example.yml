---
# Shape of vault.yml. Create the real file with `ansible-vault create group_vars/all/vault.yml`.
# This example stays outside group_vars so Ansible never loads its placeholders.
# Generate each password with `openssl rand -hex 24`.
vault_ghcr_user: your-github-username
vault_ghcr_token: a-classic-token-with-read-packages-only
vault_postgres_superuser_password: replace-me
vault_staging_owner_password: replace-me
vault_staging_app_password: replace-me
