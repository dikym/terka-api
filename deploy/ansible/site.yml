---
- name: Prepare the Terka server
  hosts: terka
  become: true
  pre_tasks:
    - name: Refuse systems the roles were not written for
      ansible.builtin.assert:
        that: ansible_facts['distribution'] in ['Ubuntu', 'Debian']
        fail_msg: >-
          This playbook supports Ubuntu and Debian only, found {{ ansible_facts['distribution'] }}.
          Ask before adapting it.
  roles:
    - base
    - docker
    - terka
