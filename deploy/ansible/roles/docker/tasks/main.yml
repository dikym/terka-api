---
- name: Add Docker's package repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    signed_by: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    update_cache: true

# Alloy reads container logs from the host journal, so it needs neither the Docker socket nor
# /var/lib/docker. Running containers keep their old driver until they are recreated.
- name: Send container logs to the journal
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {"log-driver": "journald"}
    mode: "0644"
  notify: Restart Docker

- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

# The disk is 40 GB and container logs now land in the journal, so the journal gets the size cap.
- name: Keep the journal on disk and cap its size
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/terka.conf
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse=1G
    mode: "0644"
  notify: Restart journald

- name: Start Docker on boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
