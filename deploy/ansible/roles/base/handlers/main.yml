---
# Handlers run at the end of the play in the order written here; SSH reloads last, after the admin
# key is in place.
- name: Format the swap file
  ansible.builtin.command: mkswap /swapfile
  changed_when: true

- name: Turn the swap on
  ansible.builtin.command: swapon /swapfile
  changed_when: true

- name: Reload SSH
  ansible.builtin.service:
    name: ssh
    state: reloaded
