---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - ufw
      - ca-certificates
      - curl
    update_cache: true
    cache_valid_time: 3600

- name: Apply security updates automatically
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

# The admin login must work before SSH is hardened, or this play locks the owner out.
- name: Create the admin user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    shell: /bin/bash
    groups: sudo
    append: true

- name: Install the admin key
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ admin_ssh_public_key }}"
    exclusive: true

- name: Let the admin use sudo without a password
  ansible.builtin.copy:
    dest: /etc/sudoers.d/10-terka-admin
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Create the deploy user
  ansible.builtin.user:
    name: deploy
    shell: /bin/bash
    password_lock: true

- name: Harden SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-terka.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    mode: "0644"
  notify: Reload SSH

- name: Check the SSH configuration before it is loaded
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

- name: Create the swap file
  ansible.builtin.command: fallocate -l {{ swap_size_mb }}M /swapfile
  args:
    creates: /swapfile

- name: Restrict the swap file
  ansible.builtin.file:
    path: /swapfile
    mode: "0600"

# Decided from the live state, not from "the file was just created": a run that died after
# fallocate would otherwise leave an unformatted swap file that later runs never turn on.
- name: List the active swap
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: base_active_swap
  changed_when: false

- name: Format and turn on the swap file
  when: "'/swapfile' not in base_active_swap.stdout_lines"
  block:
    - name: Format the swap file
      ansible.builtin.command: mkswap /swapfile
      changed_when: true
    - name: Turn the swap on
      ansible.builtin.command: swapon /swapfile
      changed_when: true

- name: Keep the swap after a reboot
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: /swapfile none swap sw 0 0

- name: Prefer memory over swap
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

# Docker-published ports bypass ufw; the Lighthouse console firewall limits 443 to Cloudflare.
- name: Allow HTTPS
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Deny everything else and turn the firewall on
  community.general.ufw:
    state: enabled
    default: deny
    direction: incoming
