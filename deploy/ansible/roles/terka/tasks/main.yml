---
- name: Let the deploy user run Docker
  ansible.builtin.user:
    name: deploy
    groups: docker
    append: true

- name: Create the Terka directories
  ansible.builtin.file:
    path: "{{ terka_root }}/{{ item.path }}"
    state: directory
    owner: deploy
    group: deploy
    mode: "{{ item.mode }}"
  loop:
    - { path: "", mode: "0750" }
    - { path: bin, mode: "0750" }
    - { path: backups, mode: "0700" }
    - { path: infra, mode: "0750" }
    - { path: infra/certs, mode: "0700" }
    # Read by the postgres user inside the container on the cluster's first start.
    - { path: infra/postgres, mode: "0755" }
    - { path: infra/postgres/init, mode: "0755" }
    - { path: staging, mode: "0750" }
    - { path: production, mode: "0750" }

# Outside compose: running containers must join them before Caddy is recreated on them.
- name: Check for the edge and observability networks
  ansible.builtin.command: docker network inspect {{ item }}
  loop: [terka-edge, terka-obs]
  register: terka_networks
  changed_when: false
  failed_when: false
  # Read-only, so it also runs under --check and the next task has an rc to test.
  check_mode: false

- name: Create the missing networks
  ansible.builtin.command: docker network create {{ item.item }}
  loop: "{{ terka_networks.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
  changed_when: true

- name: Copy the shared infrastructure files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../{{ item.src }}"
    dest: "{{ terka_root }}/{{ item.dest }}"
    owner: deploy
    group: deploy
    mode: "{{ item.mode }}"
  loop:
    - { src: compose.infra.yaml, dest: infra/compose.infra.yaml, mode: "0640" }
    - { src: Caddyfile, dest: infra/Caddyfile, mode: "0644" }
    - { src: Caddyfile.routes, dest: infra/Caddyfile.routes, mode: "0644" }
    - { src: postgres/init/00-roles.sql, dest: infra/postgres/init/00-roles.sql, mode: "0644" }
    - { src: compose.api.yaml, dest: compose.api.yaml, mode: "0640" }
    - { src: compose.web.yaml, dest: compose.web.yaml, mode: "0640" }
    - { src: scripts/create-env-db.sh, dest: bin/create-env-db.sh, mode: "0750" }
    - { src: scripts/create-monitor-role.sh, dest: bin/create-monitor-role.sh, mode: "0750" }
    - { src: scripts/deploy.sh, dest: bin/deploy.sh, mode: "0750" }

- name: Write the Postgres superuser password
  ansible.builtin.copy:
    dest: "{{ terka_root }}/infra/.env"
    content: "POSTGRES_PASSWORD={{ postgres_superuser_password }}\n"
    owner: deploy
    group: deploy
    mode: "0600"
  no_log: true

- name: Write each environment's database passwords for create-env-db.sh
  ansible.builtin.copy:
    dest: "{{ terka_root }}/{{ item }}/db.env"
    content: |
      OWNER_PASSWORD={{ terka_db_passwords[item].owner }}
      APP_PASSWORD={{ terka_db_passwords[item].app }}
      AUTH_PASSWORD={{ terka_db_passwords[item].auth }}
    owner: deploy
    group: deploy
    mode: "0600"
  loop: "{{ terka_environments }}"
  no_log: true

- name: Write each environment's settings
  ansible.builtin.template:
    src: env.j2
    dest: "{{ terka_root }}/{{ item }}/.env"
    owner: deploy
    group: deploy
    mode: "0600"
  loop: "{{ terka_environments }}"
  no_log: true

# Read only by the migrate service; the serving app never sees the schema owner's login.
- name: Write each environment's migration settings
  ansible.builtin.template:
    src: migrate.env.j2
    dest: "{{ terka_root }}/{{ item }}/migrate.env"
    owner: deploy
    group: deploy
    mode: "0600"
  loop: "{{ terka_environments }}"
  no_log: true

- name: Create the deploy user's Docker config directory
  ansible.builtin.file:
    path: /home/deploy/.docker
    state: directory
    owner: deploy
    group: deploy
    mode: "0700"

- name: Log the deploy user in to GHCR for pulls
  ansible.builtin.copy:
    dest: /home/deploy/.docker/config.json
    content: "{{ {'auths': {'ghcr.io': {'auth': (ghcr_user ~ ':' ~ ghcr_token) | b64encode}}} | to_nice_json }}\n"
    owner: deploy
    group: deploy
    mode: "0600"
  no_log: true

- name: Create the deploy user's SSH directory
  ansible.builtin.file:
    path: /home/deploy/.ssh
    state: directory
    owner: deploy
    group: deploy
    mode: "0700"

# One key per repository. Each can run the deploy script for its own service and nothing else: no
# shell, no forwarding, and no way to name the other service. Written whole, so a removed key goes.
- name: Install the CI deploy keys
  ansible.builtin.copy:
    dest: /home/deploy/.ssh/authorized_keys
    content: |
      # Written by Ansible: one line per CI deploy key.
      {% for service, key in deploy_ci_public_keys.items() if key | length > 0 %}
      restrict,command="{{ terka_root }}/bin/deploy.sh {{ service }}" {{ key }}
      {% endfor %}
    owner: deploy
    group: deploy
    mode: "0600"
