# Local development and CI database. Not used on the server.
name: terka-dev

services:
  postgres:
    build:
      context: ..
      dockerfile: deploy/postgres-test.Dockerfile
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      # The 18 image keeps its data one level up from where older majors did.
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP on purpose: the socket answers during first-run init, before the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
