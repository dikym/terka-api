# The API of one environment. Lives at /opt/terka/compose.api.yaml; deploy.sh runs it as:
#   TERKA_ENV_NAME=staging TERKA_IMAGE=ghcr.io/dikym/terka-api:<sha> \
#     docker compose -p terka-staging-api -f compose.api.yaml up -d --no-deps --no-recreate --scale api=<n+1> api
# so the new container starts beside the running one.
name: terka-${TERKA_ENV_NAME:?set TERKA_ENV_NAME}-api

services:
  api:
    image: ${TERKA_IMAGE:?set TERKA_IMAGE}
    restart: unless-stopped
    env_file: ${TERKA_ENV_NAME}/.env
    read_only: true
    mem_limit: 128m
    # The server gives running requests 20 seconds after SIGTERM; Docker kills after 10 by default.
    stop_grace_period: 25s
    # Postgres only. deploy.sh adds the container to terka-edge, under terka-<env>-api, once healthy.
    networks: [terka]

  migrate:
    image: ${TERKA_IMAGE}
    command: ["migrate"]
    # Only the schema owner's URL, kept apart from the API: that role bypasses row level security.
    env_file: ${TERKA_ENV_NAME}/migrate.env
    read_only: true
    profiles: [tools]
    networks: [terka]

networks:
  terka:
    external: true
    name: terka
